name: Build and Deploy ASF Site

on:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Whether to publish built site to asf-site (true = deploy, false = only build)"
        required: true
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build and check generated site
        run: pnpm run check:site
      - name: Copy .asf.yaml
        run: cp .asf.yaml build/.asf.yaml
      - name: Publish to asf-site
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: asf-site
